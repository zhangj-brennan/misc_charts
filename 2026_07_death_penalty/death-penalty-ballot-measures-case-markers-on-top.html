<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Death Penalty Ballot Measures Over Time</title>
  <style>
    .case-marker-line {
  stroke: #000000;
  stroke-width: 1.5;
  stroke-dasharray: 4 3;

}

.case-marker-label {
  fill: #000000;

    --ff-bcj-sans,

  );

}

      --chart-text: #000000;
      --chart-muted: #000000;
      --chart-grid: #d9d9d9;
      --chart-baseline: #000000;

    .ballot-chart-page {

    .ballot-chart-title {

      font-weight: 700;

      line-height: 1.4;
    }

    .ballot-chart-legend {
      display: flex;

      align-items: center;
      gap: 8px 18px;
      margin: 0 0 10px;
      color: #000000;
      font-size: 12px;
      line-height: 1.25;
    }

    .ballot-chart-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .ballot-chart-legend-dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      flex: 0 0 11px;
      border-radius: 50%;
    }

    .ballot-chart-legend-dot.abolish {
      background: var(--chart-abolish);
      border: 1px solid var(--chart-abolish);
    }

    .ballot-chart-legend-dot.reinstate {
      background: var(--chart-reinstate);
      border: 1px solid var(--chart-reinstate);
    }

    .ballot-chart-legend-dot.passed {
      background: #000000;
      border: 1px solid #000000;
    }

    .ballot-chart-legend-dot.not-passed {
      background: #ffffff;
      border: 1px solid #000000;
    }

    .ballot-chart-wrap {
      position: relative;
      width: 100%;
      overflow-x: auto;
      border: 0;

      display: block;
      min-width: 760px;
      width: 100%;
      height: auto;

    }

      .ballot-chart-wrap {

      }

      #ballotChart {
        min-width: 0;
        width: 100%;
      }

    .ballot-chart-tooltip {
      position: fixed;
      z-index: 20;
      width: max-content;

      padding: 8px 10px;
      border: 1px solid var(--chart-border);
      border-radius: 0;
      background: var(--chart-tooltip-background);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.16);
      color: #000000;

      line-height: 1.35;

      opacity: 0;
      transform: translate(-50%, calc(-100% - 11px));
      transition: opacity 100ms ease;

    .ballot-chart-tooltip strong {
      display: block;
      margin: 0 0 2px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
    }

    .ballot-chart-source {
      margin: 8px 0 0;
      padding-top: 7px;
      color: #000000;
      font-size: 12px;
      line-height: 1.35;
    }

    .ballot-chart-source strong {
      color: #000000;
      font-weight: 700;
    }

    .axis-label,
    .section-label,
    .year-label {
      font-family: var(
        --ff-bcj-sans,
        "Benton Sans",
        sans-serif
      );
      /* fill: var(--chart-text); */
    }

    .axis-label {
      font-size: 12px;
      font-weight: 400;
    }

    .section-label {
      font-size: 13px;
      font-weight: 700;
    }

    .year-label {
      fill: #000000;
      font-size: 11px;
      font-weight: 400;
    }

    .grid-line {
      stroke: var(--chart-grid);
      stroke-width: 1;
      stroke-dasharray: none;
      shape-rendering: crispEdges;
    }

    .baseline {
      stroke: var(--chart-baseline);
      stroke-width: 1;
      shape-rendering: crispEdges;
    }

    .measure-symbol {
      stroke-width: 2;
      cursor: pointer;
      transition: r 100ms ease, opacity 100ms ease;
    }

    .measure-symbol:hover,
    .measure-symbol:focus {
      stroke: #000000;
      stroke-width: 1.5;
      outline: none;
    }

    @media (max-width: 860px) {
      .ballot-chart-page {
        padding-right: 16px;
        padding-left: 16px;
      }
    }

    @media (max-width: 640px) {
      .ballot-chart-page {
        padding-top: 16px;
        padding-right: 12px;
        padding-left: 12px;
      }

      .ballot-chart-title {
        font-size: 20px;
        line-height: 1.18;
      }

      .ballot-chart-deck {
        margin-bottom: 13px;
        font-size: 15px;
        line-height: 1.4;
      }

      .ballot-chart-legend {
        gap: 7px 14px;
        font-size: 12px;
      }
    }
    a{
      text-decoration:none;
      color:#005daa;
    }
  </style>
</head>
<body>

    <p class="ballot-chart-deck">
    </p>

    <div class="ballot-chart-legend" aria-label="Chart legend">
      <!-- <span class="ballot-chart-legend-item">
        <span class="ballot-chart-legend-dot abolish"></span>

      </span>

    <p class="ballot-chart-source"><strong>Source: </strong><a href="https://ballotpedia.org/History_of_death_penalty_ballot_measures#Timeline_of_death_penalty_ballot_measures" target="_blank">History of death penalty ballot measures - Ballotpedia</a>
  </main>

  <script>
    const CSV_FILE = "ballot-measures.csv";

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = "";
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const character = text[i];
        const nextCharacter = text[i + 1];

        if (character === '"') {
          if (insideQuotes && nextCharacter === '"') {
            field += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (character === "," && !insideQuotes) {
          row.push(field.trim());
          field = "";
        } else if ((character === "\n" || character === "\r") && !insideQuotes) {
          if (character === "\r" && nextCharacter === "\n") {
            i++;
          }

          row.push(field.trim());
          field = "";

          if (row.some(value => value !== "")) {
            rows.push(row);
          }

          row = [];
        } else {
          field += character;
        }
      }

      row.push(field.trim());

      if (row.some(value => value !== "")) {
        rows.push(row);
      }

      if (!rows.length) return [];

      const headers = rows[0].map(header => header.trim());

      return rows.slice(1).map(values => {
        const item = {};

        headers.forEach((header, index) => {
          item[header] = values[index] || "";
        });

        return item;
      });
    }

    function isYes(value) {
      return String(value || "").trim().toLowerCase() === "yes";
    }

    function prepareData(rows) {
      const prepared = [];

      rows.forEach((row, rowIndex) => {
        const year = Number(row.Year);
        if (!Number.isFinite(year)) return;

        const base = {
          id: rowIndex,
          state: row.State || "Unknown",
          year,
          passed: isYes(row["Passed?"])
        };

        if (isYes(row["Ballot Measure to Abolish Death Penalty?"])) {
          prepared.push({
            ...base,
            type: "abolish",
            typeLabel: "Abolish the death penalty"
          });
        }

        if (isYes(row["Ballot Measure to Reinstate Death Penalty?"])) {
          prepared.push({
            ...base,
            id: `${rowIndex}-reinstate`,
            type: "reinstate",
            typeLabel: "Reinstate the death penalty"
          });
        }
      });

      return prepared;
    }

    function createSvgElement(name, attributes = {}) {
      const element = document.createElementNS("http://www.w3.org/2000/svg", name);

      Object.entries(attributes).forEach(([key, value]) => {
        element.setAttribute(key, value);
      });

      return element;
    }

    function addTooltipBehavior(circle, d, tooltip) {
      function showTooltip(event) {
        tooltip.innerHTML = `
          <strong>${d.state}, ${d.year}</strong>
          ${d.typeLabel}<br>
          <span>${d.passed ? "Passed" : "Did not pass"}</span>
        `;

        const bounds = circle.getBoundingClientRect();
        const clientX = event.clientX ?? bounds.left + bounds.width / 2;
        const clientY = event.clientY ?? bounds.top;

        tooltip.style.left = `${clientX}px`;
        tooltip.style.top = `${clientY}px`;
        tooltip.style.opacity = "1";
      }

      function hideTooltip() {
        tooltip.style.opacity = "0";
      }

      circle.addEventListener("mouseenter", showTooltip);
      circle.addEventListener("mousemove", showTooltip);
      circle.addEventListener("mouseleave", hideTooltip);
      circle.addEventListener("focus", showTooltip);
      circle.addEventListener("blur", hideTooltip);
    }
const caseMarkers = [
  {
    year: 1972,
    label: "Furman v. Georgia"
  },
  {
    year: 1976,
    label: "Gregg v. Georgia"
  }
];
function renderHorizontalChart(data, svg, tooltip, wrapper) {
  const width = Math.max(wrapper.clientWidth, 760);
  const height = 200;
  const margin = { top: 30, right: 35, bottom: 40, left: 60 };
  const plotLeft = margin.left;
  const plotRight = width - margin.right;
  const plotTop = margin.top;
  const plotBottom = height - margin.bottom;
  const baselineY = Math.round((plotTop + plotBottom) / 2);
  const symbolRadius = 6;
  const stackGap = (symbolRadius + 2) * 2;

  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);

  const years = data.map(d => d.year);
  let minYear = Math.min(...years);
  let maxYear = Math.max(...years);

  if (minYear === maxYear) {
    minYear -= 1;
    maxYear += 1;
  }

  const yearPadding = Math.max(
    1,
    Math.round((maxYear - minYear) * 0.025)
  );

  const domainMin = minYear - yearPadding;
  const domainMax = maxYear + yearPadding;

  const xScale = year =>
    plotLeft +
    ((year - domainMin) / (domainMax - domainMin)) *
      (plotRight - plotLeft);

  const range = maxYear - minYear;
  let tickStep = 5;

  if (range <= 20) tickStep = 2;
  else if (range <= 50) tickStep = 5;
  else if (range <= 120) tickStep = 10;
  else tickStep = 10;

  const axisMin = Math.floor(minYear / tickStep) * tickStep;
  const axisMax = Math.ceil(maxYear / tickStep) * tickStep;

  const tickYears = [];

  for (
    let year = axisMin;
    year <= axisMax;
    year += tickStep
  ) {
    tickYears.push(year);
  }

  [...new Set(tickYears)]
    .sort((a, b) => a - b)
    .forEach(year => {
      const x = xScale(year);

      svg.appendChild(
        createSvgElement("line", {
          x1: x,
          y1: plotTop,
          x2: x,
          y2: plotBottom,
          class: "grid-line"
        })
      );

      const yearLabel = createSvgElement("text", {
        x,
        y: plotBottom + 12,
        "text-anchor": "middle",
        class: "year-label"
      });

      yearLabel.textContent = year;
      svg.appendChild(yearLabel);
    });


  svg.appendChild(
    createSvgElement("line", {
      x1: 2,
      y1: baselineY,
      x2: plotRight + 20,
      y2: baselineY,
      class: "baseline"
    })
  );

  const abolishLabel = createSvgElement("text", {
    x: 2,
    y: baselineY - 4,
    "text-anchor": "start",
    class: "section-label"
  });

  abolishLabel.textContent =
    "Ballot Measures to Abolish the Death Penalty";

  svg.appendChild(abolishLabel);

  const reinstateLabel = createSvgElement("text", {
    x: 2,
    y: baselineY + 14,
    "text-anchor": "start",
    class: "section-label",
    fill: "var(--chart-reinstate)"
  });

  reinstateLabel.textContent =
    "Ballot Measures to Enact the Death Penalty";

  svg.appendChild(reinstateLabel);

  const axisTitle = createSvgElement("text", {
    x: (plotLeft + plotRight) / 2,
    y: height - 1,
    "text-anchor": "middle",
    class: "axis-label",
    "font-size": "13",
    "font-weight": "700"
  });

  axisTitle.textContent = "Year";
  svg.appendChild(axisTitle);

  const groupedCounts = new Map();

  data
    .slice()
    .sort(
      (a, b) =>
        a.year - b.year ||
        a.state.localeCompare(b.state)
    )
    .forEach(d => {
      const groupKey = `${d.year}-${d.type}`;
      const stackIndex =
        groupedCounts.get(groupKey) || 0;

      groupedCounts.set(groupKey, stackIndex + 1);

      const direction =
        d.type === "abolish" ? -1 : 1;

      const y =
        baselineY +
        direction *
          (30 + stackIndex * stackGap);

      const color =
        d.type === "abolish"
          ? "var(--chart-abolish)"
          : "var(--chart-reinstate)";

      const circle = createSvgElement("circle", {
        cx: xScale(d.year),
        cy: y,
        r: d.passed
          ? symbolRadius + 2
          : symbolRadius,
        fill: d.passed ? color : "#ffffff",
        stroke: d.passed ? "#ffffff" : color,
        "stroke-width": 2,
        class: "measure-symbol",
        tabindex: "0",
        role: "img",
        "aria-label":
          `${d.state}, ${d.year}, ${d.typeLabel}, ` +
          `${d.passed ? "passed" : "did not pass"}`
      });

      addTooltipBehavior(circle, d, tooltip);
      svg.appendChild(circle);
    });

  caseMarkers.forEach((marker, index) => {
    const x = xScale(marker.year);

    svg.appendChild(createSvgElement("line", {
      x1: x,
      y1: plotTop,
      x2: x,
      y2: plotBottom,
      stroke: index === 0 ? "#6a3d9a" : "#1f78b4",
      "stroke-width": 3,
      class: "case-marker-line"
    }));

    const caseLabel = createSvgElement("text", {
      x: x + (index === 0 ? -6 : 6),
      y: plotTop - 8,
      "text-anchor": index === 0 ? "end" : "start",
      fill: index === 0 ? "#6a3d9a" : "#1f78b4",
      "font-size": 11,
      "font-weight": 700,
      class: "case-marker-label"
    });
    caseLabel.textContent = `${marker.label} (${marker.year})`;
    svg.appendChild(caseLabel);
  });
}

function renderVerticalChart(data, svg, tooltip, wrapper) {
  const width = Math.max(wrapper.clientWidth, 280);
  const margin = {
    top: 42,
    right: 14,
    bottom: 28,
    left: 14
  };

  const axisX = Math.round(width / 2);
  const labelGap = 28;
  const symbolRadius = 6;
  const stackGap = 16;
  const sideGap = 18;

  const years = data.map(d => d.year);
  let minYear = Math.min(...years);
  let maxYear = Math.max(...years);

  if (minYear === maxYear) {
    minYear -= 1;
    maxYear += 1;
  }

  const range = maxYear - minYear;
  let tickStep = 10;

  if (range <= 20) tickStep = 2;
  else if (range <= 50) tickStep = 5;
  else if (range <= 120) tickStep = 10;
  else tickStep = 20;

  const axisMin =
    Math.floor(minYear / tickStep) * tickStep;

  const axisMax =
    Math.ceil(maxYear / tickStep) * tickStep;

  const rowHeight = 7;
  const plotTop = margin.top;

  const availablePlotHeight =
    600 - margin.top - margin.bottom;

  const plotHeight = Math.min(
    availablePlotHeight,
    Math.max(420, range * rowHeight)
  );

  const plotBottom = plotTop + plotHeight;

  const height = Math.min(
    600,
    plotBottom + margin.bottom
  );

  svg.setAttribute(
    "viewBox",
    `0 0 ${width} ${height}`
  );

  svg.setAttribute("width", width);
  svg.setAttribute("height", height);

  const yScale = year =>
    plotTop +
    ((year - axisMin) / (axisMax - axisMin)) *
      plotHeight;

  svg.appendChild(
    createSvgElement("line", {
      x1: axisX,
      y1: plotTop,
      x2: axisX,
      y2: plotBottom,
      class: "baseline"
    })
  );

  const abolishLabel = createSvgElement("text", {
    x: axisX - labelGap,
    y: 14,
    "text-anchor": "end",
    class: "section-label"
  });

  const abolishLine1 = createSvgElement("tspan", {
    x: axisX - labelGap,
    dy: 0
  });

  abolishLine1.textContent =
    "Ballot Measures to";

  const abolishLine2 = createSvgElement("tspan", {
    x: axisX - labelGap,
    dy: 14
  });

  abolishLine2.textContent =
    "Abolish the Death Penalty";

  abolishLabel.appendChild(abolishLine1);
  abolishLabel.appendChild(abolishLine2);
  svg.appendChild(abolishLabel);

  const reinstateLabel = createSvgElement("text", {
    x: axisX + labelGap,
    y: 14,
    "text-anchor": "start",
    class: "section-label",
    fill: "var(--chart-reinstate)"
  });

  const reinstateLine1 = createSvgElement(
    "tspan",
    {
      x: axisX + labelGap,
      dy: 0
    }
  );

  reinstateLine1.textContent =
    "Ballot Measures to";

  const reinstateLine2 = createSvgElement(
    "tspan",
    {
      x: axisX + labelGap,
      dy: 14
    }
  );

  reinstateLine2.textContent =
    "Enact the Death Penalty";

  reinstateLabel.appendChild(reinstateLine1);
  reinstateLabel.appendChild(reinstateLine2);
  svg.appendChild(reinstateLabel);

  const tickYears = [];

  for (
    let year = axisMin;
    year <= axisMax;
    year += tickStep
  ) {
    tickYears.push(year);
  }

  [...new Set(tickYears)]
    .sort((a, b) => a - b)
    .forEach(year => {
      const y = yScale(year);

      svg.appendChild(
        createSvgElement("line", {
          x1: margin.left,
          y1: y,
          x2: width - margin.right,
          y2: y,
          class: "grid-line"
        })
      );

      const yearLabel = createSvgElement("text", {
        x: margin.left + 2,
        y: y - 5,
        "text-anchor": "start",
        class: "year-label"
      });

      yearLabel.textContent = year;
      svg.appendChild(yearLabel);
    });


  const groupedCounts = new Map();

  data
    .slice()
    .sort(
      (a, b) =>
        a.year - b.year ||
        a.state.localeCompare(b.state)
    )
    .forEach(d => {
      const groupKey = `${d.year}-${d.type}`;

      const stackIndex =
        groupedCounts.get(groupKey) || 0;

      groupedCounts.set(groupKey, stackIndex + 1);

      const direction =
        d.type === "abolish" ? -1 : 1;

      const x =
        axisX +
        direction *
          (sideGap + stackIndex * stackGap);

      const y = yScale(d.year);

      const color =
        d.type === "abolish"
          ? "var(--chart-abolish)"
          : "var(--chart-reinstate)";

      const circle = createSvgElement("circle", {
        cx: x,
        cy: y,
        r: d.passed
          ? symbolRadius + 2
          : symbolRadius,
        fill: d.passed ? color : "#ffffff",
        stroke: d.passed ? "#ffffff" : color,
        "stroke-width": 2,
        class: "measure-symbol",
        tabindex: "0",
        role: "img",
        "aria-label":
          `${d.state}, ${d.year}, ${d.typeLabel}, ` +
          `${d.passed ? "passed" : "did not pass"}`
      });

      addTooltipBehavior(circle, d, tooltip);
      svg.appendChild(circle);
    });

  caseMarkers.forEach((marker, index) => {
    const y = yScale(marker.year);

    svg.appendChild(createSvgElement("line", {
      x1: margin.left,
      y1: y,
      x2: width - margin.right,
      y2: y,
      stroke: index === 0 ? "#6a3d9a" : "#1f78b4",
      "stroke-width": 3,
      class: "case-marker-line"
    }));

    const caseLabel = createSvgElement("text", {
      x: width - margin.right - 2,
      y: y - 6,
      "text-anchor": "end",
      fill: index === 0 ? "#6a3d9a" : "#1f78b4",
      "font-size": 11,
      "font-weight": 700,
      class: "case-marker-label"
    });
    caseLabel.textContent = `${marker.label} (${marker.year})`;
    svg.appendChild(caseLabel);
  });
}

    function renderChart(rows) {
      const data = prepareData(rows);
      const svg = document.getElementById("ballotChart");
      const tooltip = document.getElementById("ballotTooltip");
      const wrapper = document.querySelector(".ballot-chart-wrap");

      svg.innerHTML = "";

      if (!data.length) {
        svg.setAttribute("viewBox", "0 0 900 300");
        const emptyText = createSvgElement("text", {
          x: 450,
          y: 150,
          "text-anchor": "middle",
          class: "axis-label"
        });
        emptyText.textContent = "No valid ballot measure rows found.";
        svg.appendChild(emptyText);
        return;
      }

      const title = createSvgElement("title", { id: "chartTitle" });
      title.textContent = "Death Penalty Ballot Measures Over Time";
      svg.appendChild(title);

      const description = createSvgElement("desc", { id: "chartDescription" });
      description.textContent = window.innerWidth <= 640
        ? "A vertical timeline with years running from top to bottom. Measures to abolish the death penalty appear to the left of the center axis in black. Measures to reinstate it appear to the right in red. Filled symbols passed and hollow symbols did not pass."
        : "A symbol chart with years along the horizontal axis. Measures to abolish the death penalty are above the baseline and shown in black. Measures to reinstate it are below and shown in red. Filled symbols passed and hollow symbols did not pass.";
      svg.appendChild(description);

      if (window.innerWidth <= 640) {
        renderVerticalChart(data, svg, tooltip, wrapper);
      } else {
        renderHorizontalChart(data, svg, tooltip, wrapper);
      }
    }

    let loadedRows = [];

    async function loadChartData() {
      const svg = document.getElementById("ballotChart");

      try {
        const response = await fetch(CSV_FILE);

        if (!response.ok) {
          throw new Error(`Could not load ${CSV_FILE}: ${response.status}`);
        }

        const csvText = await response.text();
        loadedRows = parseCSV(csvText);
        renderChart(loadedRows);
      } catch (error) {
        console.error(error);

        svg.setAttribute("viewBox", "0 0 900 300");
        svg.innerHTML = "";

        const errorText = createSvgElement("text", {
          x: 450,
          y: 135,
          "text-anchor": "middle",
          class: "axis-label",
          "font-size": "15",
          "font-weight": "700"
        });
        errorText.textContent = "The CSV file could not be loaded.";
        svg.appendChild(errorText);

        const helpText = createSvgElement("text", {
          x: 450,
          y: 165,
          "text-anchor": "middle",
          class: "axis-label",
          "font-size": "13"
        });
        helpText.textContent = `Place ${CSV_FILE} in the same folder and open this page through a local server.`;
        svg.appendChild(helpText);
      }
    }

    loadChartData();

    window.addEventListener("resize", () => {
      if (loadedRows.length) {
        renderChart(loadedRows);
      }
    });
  </script>
</body>
</html>
